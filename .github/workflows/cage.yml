# The definition of this workflow always comes from master (pull_request_target), never from the pull request.
name: cage
on:
  pull_request_target:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  cage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: master (trusted scripts)
        uses: actions/checkout@v4
      - name: the work under judgement (data, not code we trust)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: protected paths untouched
        if: github.event_name == 'pull_request_target'
        run: |
          cd pr
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- .github cage CODEOWNERS)
          if [ -n "$changed" ]; then echo "protected paths changed (only the author changes these, on master):"; echo "$changed"; exit 1; fi
      - name: charter at the locked, author-signed commit
        run: sh cage/fetch_charter.sh
      - name: imports
        run: python3 cage/lint_imports.py pr/src/wald
      - name: imports refuse the poisons
        run: |
          for d in cage/lint_poisons/*/; do
            if python3 cage/lint_imports.py "$d" > /dev/null; then echo "the lint passes a poison: $d"; exit 1; fi
          done
      # The seed reaches the kit as a file the kit reads and deletes before it imports the work under judgement; it is
      # never in the environment of a process that runs that work (laws/kit_seed.py, kit v0.14). This step runs no PR code.
      - name: seed
        env:
          KIT_SEED: ${{ secrets.KIT_SEED }}
        run: umask 077 && printf '%s' "$KIT_SEED" > "$RUNNER_TEMP/kit_seed"
      - name: kit
        run: python3 charter/laws/kit.py --impl pr/src --worlds 300 --seed-file "$RUNNER_TEMP/kit_seed"
